name: Revenue Engine official website seed preview

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type WEBSITE_SEED_PREVIEW to confirm this run is preview-only
        required: true
        type: string
      website_urls:
        description: Up to five official HTTPS website URLs separated by commas
        required: true
        type: string
      country:
        description: Configured target country
        required: true
        default: India
        type: string

permissions:
  contents: read

concurrency:
  group: revenue-engine-website-seed-worker
  cancel-in-progress: false

jobs:
  website-seed-preview:
    if: github.repository == 'Sanchit3133/Revenue-Engine'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Require explicit preview confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "WEBSITE_SEED_PREVIEW" ]; then
            echo "::error::Confirmation did not match. No websites were inspected."
            exit 1
          fi

      - name: Require production read-only database secret
        env:
          DATABASE_URL: ${{ secrets.REVENUE_ENGINE_PRODUCTION_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Missing REVENUE_ENGINE_PRODUCTION_DATABASE_URL Actions secret."
            exit 1
          fi
          echo "Production database secret is present; its value is not shown."

      - name: Check out PostgreSQL-capable worker code
        uses: actions/checkout@v4
        with:
          ref: deployment/replit-full-engine-20261015

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install worker dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q app scripts tests

      - name: Test seed parsing and contact-extraction safeguards
        run: python -m unittest tests.test_github_website_seed_worker -v

      - name: Inspect official websites without writing leads
        env:
          DATABASE_URL: ${{ secrets.REVENUE_ENGINE_PRODUCTION_DATABASE_URL }}
          DATABASE_BACKEND: postgresql
          ENVIRONMENT: production
          WEBSITE_URLS: ${{ inputs.website_urls }}
          COUNTRY: ${{ inputs.country }}
        run: |
          python -m scripts.github_website_seed_worker \
            --websites "$WEBSITE_URLS" \
            --country "$COUNTRY"
