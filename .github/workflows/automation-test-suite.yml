name: Revenue Engine automation test suite

on:
  push:
    branches:
      - feat/automated-overture-outreach-20261017
      - fix/healthz-deployment-check-20261018
  pull_request:
    branches:
      - main
      - deployment/replit-full-engine-20261015

permissions:
  contents: read

concurrency:
  group: revenue-engine-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-worker.txt
      - name: Compile Python files
        run: python -m compileall -q app scripts tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
