name: Revenue Engine lead discovery dry run

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DISCOVERY_DRY_RUN to confirm this does not save leads or send email
        required: true
        type: string
      city:
        description: City to research
        required: true
        default: Nagpur
        type: string
      country:
        description: Configured target country
        required: true
        default: India
        type: string
      query:
        description: Target business query
        required: true
        default: coaching institute
        type: string

permissions:
  contents: read

jobs:
  lead-discovery-preview:
    if: github.repository == 'Sanchit3133/Revenue-Engine'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require explicit dry-run confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "DISCOVERY_DRY_RUN" ]; then
            echo "::error::Confirmation did not match; discovery was not started."
            exit 1
          fi

      - name: Verify required secrets are present
        env:
          DATABASE_URL: ${{ secrets.REVENUE_ENGINE_PRODUCTION_DATABASE_URL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Missing REVENUE_ENGINE_PRODUCTION_DATABASE_URL Actions secret."
            exit 1
          fi
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "::error::Missing GOOGLE_API_KEY Actions secret."
            exit 1
          fi
          echo "Required secrets are present; values are not printed."

      - name: Check out default-branch code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install application dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile Python source
        run: python -m compileall -q app scripts

      - name: Inspect at most five candidate businesses without saving or sending
        env:
          DATABASE_URL: ${{ secrets.REVENUE_ENGINE_PRODUCTION_DATABASE_URL }}
          DATABASE_BACKEND: postgresql
          ENVIRONMENT: production
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          CITY: ${{ inputs.city }}
          COUNTRY: ${{ inputs.country }}
          QUERY: ${{ inputs.query }}
        run: |
          python -m scripts.github_discovery_dry_run \
            --city "$CITY" \
            --country "$COUNTRY" \
            --query "$QUERY" \
            --max-places 5
