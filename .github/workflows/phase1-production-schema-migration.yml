name: Revenue Engine Phase 1 production schema migration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY_PHASE1_SCHEMA to approve this transactional schema-only migration
        required: true
        type: string

permissions: {}

jobs:
  migrate-production-schema:
    if: github.repository == 'Sanchit3133/Revenue-Engine'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require explicit confirmation and production database secret
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          DATABASE_URL: ${{ secrets.REVENUE_ENGINE_PRODUCTION_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "APPLY_PHASE1_SCHEMA" ]; then
            echo "::error::Confirmation did not match. No database connection was attempted."
            exit 1
          fi
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Missing REVENUE_ENGINE_PRODUCTION_DATABASE_URL."
            exit 1
          fi
          echo "Explicit schema-migration confirmation received. Secret value is not shown."

      - name: Install PostgreSQL driver
        run: python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"

      - name: Verify production preconditions and apply schema in one transaction
        env:
          DATABASE_URL: ${{ secrets.REVENUE_ENGINE_PRODUCTION_DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          import sys
          import psycopg

          conn = None
          try:
              conn = psycopg.connect(
                  os.environ["DATABASE_URL"],
                  connect_timeout=10,
                  application_name="revenue-engine-phase1-schema-migration",
              )
              with conn.cursor() as cursor:
                  cursor.execute("SHOW transaction_read_only")
                  if str(cursor.fetchone()[0]).lower() == "on":
                      print("STOP: the configured database connection is read-only; schema was not changed.")
                      conn.rollback()
                      sys.exit(2)

                  cursor.execute("SELECT current_database()")
                  db_name = cursor.fetchone()[0]
                  print("Target database:", db_name)

                  cursor.execute("""
                      SELECT table_name
                      FROM information_schema.tables
                      WHERE table_schema = 'public' AND table_type = 'BASE TABLE'
                  """)
                  tables = {row[0] for row in cursor.fetchall()}
                  required = {"leads", "outreach", "consultation_submissions"}
                  missing = sorted(required - tables)
                  if missing:
                      print("STOP: required base tables are missing:", ", ".join(missing))
                      conn.rollback()
                      sys.exit(2)

                  cursor.execute("""
                      SELECT COUNT(*)
                      FROM (
                          SELECT LOWER(TRIM(email))
                          FROM public.leads
                          WHERE email IS NOT NULL AND TRIM(email) <> ''
                          GROUP BY LOWER(TRIM(email))
                          HAVING COUNT(*) > 1
                      ) AS duplicate_groups
                  """)
                  duplicates = int(cursor.fetchone()[0])
                  print("Normalized duplicate-email groups:", duplicates)
                  if duplicates:
                      print("STOP: reconcile duplicate email groups before migration. No schema changes made.")
                      conn.rollback()
                      sys.exit(3)

                  # One database transaction. If any statement fails, the entire
                  # migration is rolled back; no leads/outreach rows are modified.
                  statements = [
                      """ALTER TABLE public.consultation_submissions
                         ADD COLUMN IF NOT EXISTS lead_id INTEGER
                         REFERENCES public.leads(id)""",
                      """CREATE TABLE IF NOT EXISTS public.follow_up_schedule (
                          id INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                          lead_id INTEGER NOT NULL REFERENCES public.leads(id),
                          source_outreach_id INTEGER NOT NULL REFERENCES public.outreach(id),
                          attempt_number INTEGER NOT NULL,
                          due_at TEXT NOT NULL,
                          status TEXT NOT NULL DEFAULT 'SCHEDULED',
                          claimed_at TEXT,
                          prepared_outreach_id INTEGER REFERENCES public.outreach(id),
                          cancellation_reason TEXT,
                          created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP::text,
                          updated_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP::text,
                          UNIQUE (lead_id, attempt_number)
                      )""",
                      """ALTER TABLE public.follow_up_schedule
                         ADD COLUMN IF NOT EXISTS claimed_at TEXT""",
                      """CREATE TABLE IF NOT EXISTS public.consultation_handoff_tokens (
                          id INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                          token_hash TEXT NOT NULL UNIQUE,
                          lead_id INTEGER NOT NULL REFERENCES public.leads(id),
                          expires_at TEXT NOT NULL,
                          used_at TEXT,
                          consultation_public_id TEXT,
                          created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP::text
                      )""",
                      """CREATE INDEX IF NOT EXISTS idx_follow_up_due
                         ON public.follow_up_schedule(status, due_at)""",
                      """CREATE INDEX IF NOT EXISTS idx_follow_up_lead
                         ON public.follow_up_schedule(lead_id, attempt_number)""",
                      """CREATE INDEX IF NOT EXISTS idx_handoff_lead
                         ON public.consultation_handoff_tokens(lead_id, expires_at)""",
                      """CREATE UNIQUE INDEX IF NOT EXISTS idx_leads_email_unique_normalized
                         ON public.leads(LOWER(TRIM(email)))
                         WHERE email IS NOT NULL AND TRIM(email) <> ''""",
                  ]
                  for statement in statements:
                      cursor.execute(statement)

                  cursor.execute("""
                      SELECT column_name FROM information_schema.columns
                      WHERE table_schema = 'public'
                        AND table_name = 'consultation_submissions'
                        AND column_name = 'lead_id'
                  """)
                  if cursor.fetchone() is None:
                      raise RuntimeError("consultation_submissions.lead_id verification failed")

                  cursor.execute("""
                      SELECT table_name FROM information_schema.tables
                      WHERE table_schema = 'public'
                        AND table_name IN ('follow_up_schedule', 'consultation_handoff_tokens')
                  """)
                  created_tables = {row[0] for row in cursor.fetchall()}
                  if created_tables != {"follow_up_schedule", "consultation_handoff_tokens"}:
                      raise RuntimeError("required migration tables verification failed")

                  cursor.execute("""
                      SELECT EXISTS (
                          SELECT 1 FROM pg_indexes
                          WHERE schemaname = 'public'
                            AND indexname = 'idx_leads_email_unique_normalized'
                      )
                  """)
                  if not cursor.fetchone()[0]:
                      raise RuntimeError("normalized email index verification failed")

              conn.commit()
              print("Phase 1 schema migration: SUCCESS")
              print("Verified consultation_submissions.lead_id: present")
              print("Verified follow_up_schedule: present")
              print("Verified consultation_handoff_tokens: present")
              print("Verified normalized unique email index: present")
              print("Existing leads, outreach, payments, and client-request rows were not modified.")
              print("Live outreach remains disabled; India validation and end-to-end acceptance are still required.")
          except SystemExit:
              raise
          except Exception as exc:
              if conn is not None:
                  conn.rollback()
              # Avoid printing the exception text: it may include database details.
              print("MIGRATION FAILED; transaction rolled back (" + type(exc).__name__ + ").")
              sys.exit(1)
          finally:
              if conn is not None:
                  conn.close()
          PY
