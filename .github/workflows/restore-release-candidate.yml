name: Restore integrated Revenue Engine release candidate

on:
  push:
    branches:
      - deployment/replit-full-engine-20261015
    paths:
      - ".release-import/READY"

permissions:
  contents: write

jobs:
  restore-release-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild the reviewed source tree
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.release-import/part-*.b64.txt)
          if [[ "${#parts[@]}" -ne 9 ]]; then
            echo "Expected 21 source archive chunks, found ${#parts[@]}."
            exit 1
          fi
          cat "${parts[@]}" > /tmp/revenue-engine-release.tar.gz.b64
          base64 --decode /tmp/revenue-engine-release.tar.gz.b64 > /tmp/revenue-engine-release.tar.gz
          mkdir -p /tmp/revenue-engine-release
          tar -xzf /tmp/revenue-engine-release.tar.gz -C /tmp/revenue-engine-release --no-same-owner
          cp -a /tmp/revenue-engine-release/. .
          rm -rf .release-import
          rm -f /tmp/revenue-engine-release.tar.gz.b64 /tmp/revenue-engine-release.tar.gz
          python -m compileall -q app scripts tests
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import integrated Revenue Engine release candidate"
          git push
