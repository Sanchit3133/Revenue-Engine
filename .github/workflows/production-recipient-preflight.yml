name: Revenue Engine recipient migration preflight

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN_RECIPIENT_PREFLIGHT to confirm a read-only production check
        required: true
        type: string

permissions:
  contents: read

jobs:
  duplicate-check:
    if: github.repository == 'Sanchit3133/Revenue-Engine'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require explicit read-only confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          DATABASE_URL: ${{ secrets.REVENUE_ENGINE_PRODUCTION_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "RUN_RECIPIENT_PREFLIGHT" ]; then
            echo "::error::Confirmation did not match. No database connection was attempted."
            exit 1
          fi
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Missing REVENUE_ENGINE_PRODUCTION_DATABASE_URL Actions secret."
            exit 1
          fi
          echo "Read-only recipient preflight confirmed. Secret value is hidden."

      - name: Install PostgreSQL driver
        run: python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"

      - name: Count duplicate email groups without displaying addresses
        env:
          DATABASE_URL: ${{ secrets.REVENUE_ENGINE_PRODUCTION_DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          import sys
          import psycopg

          conn = None
          try:
              conn = psycopg.connect(
                  os.environ["DATABASE_URL"],
                  connect_timeout=10,
                  options="-c default_transaction_read_only=on",
                  application_name="revenue-engine-recipient-preflight",
              )
              with conn.cursor() as cursor:
                  cursor.execute("SHOW transaction_read_only")
                  mode = str(cursor.fetchone()[0]).lower()
                  if mode != "on":
                      print("ERROR: Database session did not enter read-only mode.")
                      sys.exit(1)

                  cursor.execute(
                      "SELECT to_regclass('public.leads') IS NOT NULL"
                  )
                  if cursor.fetchone()[0] is not True:
                      print("ERROR: public.leads does not exist.")
                      sys.exit(1)

                  cursor.execute(
                      """
                      SELECT COUNT(*)
                      FROM (
                          SELECT LOWER(TRIM(email)) AS normalized_email
                          FROM public.leads
                          WHERE email IS NOT NULL AND TRIM(email) <> ''
                          GROUP BY LOWER(TRIM(email))
                          HAVING COUNT(*) > 1
                      ) AS duplicate_groups
                      """
                  )
                  duplicate_groups = int(cursor.fetchone()[0])

              print("Production database: connected in read-only mode")
              print(f"Normalized duplicate-email groups: {duplicate_groups}")
              if duplicate_groups:
                  print("STOP: reconcile duplicate lead records and preserve outreach/suppression history before creating the unique index.")
                  sys.exit(2)
              print("Recipient uniqueness preflight passed. No data was changed.")
          except SystemExit:
              raise
          except Exception as exc:
              print("ERROR: Read-only preflight failed (" + type(exc).__name__ + ").")
              sys.exit(1)
          finally:
              if conn is not None:
                  conn.close()
          PY
