<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Login | Revenue Engine</title><style>*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#101828;font:16px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif}.wrap{width:min(440px,calc(100% - 32px));margin:12vh auto}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:28px;box-shadow:0 12px 36px #1018280b}label{display:block;font-weight:750;margin-bottom:8px}input{width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:9px;font:inherit}.button{padding:13px 18px;background:#101828;color:#fff;border:0;border-radius:9px;font-weight:800;margin-top:16px;width:100%}.notice{padding:12px;border-radius:9px;background:#fef3f2;color:#b42318;margin:16px 0}.muted{color:#475467}</style></head><body><main class="wrap"><article class="card"><h1>Revenue Engine owner</h1><p class="muted">Private operations dashboard. Customer-facing pages cannot access this view.</p>{% if error %}<div class="notice" role="alert">{{ error }}</div>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="password">Owner password</label><input id="password" name="password" type="password" autocomplete="current-password" required {% if disabled %}disabled{% endif %}><button class="button" type="submit" {% if disabled %}disabled{% endif %}>Sign in</button></form><p class="muted"><a href="/">Back to customer site</a></p></article></main></body></html>
